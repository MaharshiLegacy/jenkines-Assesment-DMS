spring.application.name=dms
server.port=8081

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/DMS_DB
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# --- Upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
app.storage.dir=./uploads

# --- Domain restriction (comma separated; "*.x.com" wildcards allowed; empty list = deny all)
# Hosts through which the API may be reached
app.security.allowed-hosts=localhost,127.0.0.1,*.dms.local
# Hosts through which /api/admin/** may be reached (stricter subset)
app.security.admin-hosts=localhost,admin.dms.local
# Browser origins allowed by CORS (full origins)
app.security.allowed-origins=http://localhost:3000
# Only enable behind a reverse proxy that overwrites X-Forwarded-* headers:
# server.forward-headers-strategy=framework

# --- JWT (HS256). The secret MUST be overridden in real deployments: set env var APP_JWT_SECRET (>= 32 bytes).
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-please-32bytes-min!!}
app.jwt.issuer=dms-app
app.jwt.expiry-minutes=60

# --- Demo users (change/disable outside local dev!)
app.seed.enabled=true
app.seed.admin-password=Admin@123
app.seed.user-password=User@123
