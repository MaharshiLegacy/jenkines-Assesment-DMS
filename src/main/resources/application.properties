
spring.application.name=dms
server.port=8081

# PostgreSQL Database Configuration
# Local development can override these values using environment variables.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/DMS_DB}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
app.storage.dir=${APP_STORAGE_DIR:./uploads}

# Domain restriction
# Add your actual public hostname when exposing the application.
app.security.allowed-hosts=${APP_SECURITY_ALLOWED_HOSTS:localhost,127.0.0.1,*.dms.local}
app.security.admin-hosts=${APP_SECURITY_ADMIN_HOSTS:localhost,admin.dms.local}
app.security.allowed-origins=${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:3000}

# JWT configuration
# Production deployments should provide APP_JWT_SECRET through Kubernetes Secrets.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-change-me-please-32bytes-min!!}
app.jwt.issuer=dms-app
app.jwt.expiry-minutes=60

# Demo users
# Disable automatic demo-user seeding by default.
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.user-password=${APP_SEED_USER_PASSWORD:}
