
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-dms-repository
  namespace: demo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: jenkins-dms-repository
  template:
    metadata:
      labels:
        app: jenkins-dms-repository
    spec:
      containers:
        - name: jenkins-dms-repository
          image: asia-south1-docker.pkg.dev/project-f45bd8e2-3bd4-49b8-a29/jenkins-dms-repository/dms-image:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
