apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins-dms-repository
  namespace: demo
  labels:
    app: jenkins-dms-repository
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jenkins-dms-repository
  template:
    metadata:
      labels:
        app: jenkins-dms-repository
    spec:
      serviceAccountName: dms-ksa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        # DMS Spring Boot application
        - name: jenkins-dms-repository
          image: asia-south1-docker.pkg.dev/project-f45bd8e2-3bd4-49b8-a29/jenkins-dms-repository/dms-image:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            # Connect to PostgreSQL through the Cloud SQL Auth Proxy sidecar
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://127.0.0.1:5432/DMS_DB"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dms-db-secrets
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dms-db-secrets
                  key: password
            - name: APP_STORAGE_DIR
              value: "/data/uploads"
            - name: APP_SECURITY_ALLOWED_HOSTS
              value: "localhost,127.0.0.1,34.93.2.156"
            - name: APP_SECURITY_ADMIN_HOSTS
              value: "localhost,34.93.2.156"
            - name: APP_SECURITY_ALLOWED_ORIGINS
              value: "http://localhost:3000"
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: jwt-secret
            - name: APP_SEED_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: admin-password
            - name: APP_SEED_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dms-secrets
                  key: user-password
            - name: APP_SEED_ENABLED
              value: "false"
          volumeMounts:
            - name: data
              mountPath: /data
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
        # Cloud SQL Auth Proxy sidecar
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2
          args:
            - "--structured-logs"
            - "--port=5432"
            - "project-f45bd8e2-3bd4-49b8-a29:asia-south1:dms-postgres"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dms-data
